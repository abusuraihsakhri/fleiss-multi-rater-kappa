name: Fleiss Kappa — Tests and Security Checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q fleiss_kappa.py cli.py agents tests
      - name: Run Python tests
        run: python -m pytest -q
      - name: Test browser computation and CSV parser
        run: node --test tests/test_browser.mjs
      - name: Verify audit signature checks
        run: |
          python -c "from agents.base import AuditLogger; assert AuditLogger.verify_integrity()"
