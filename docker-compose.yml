version: '3.8'

services:
  fleiss-multi-rater-kappa:
    build: .
    container_name: fleiss-multi-rater-kappa
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=fleiss-multi-rater-kappa-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
